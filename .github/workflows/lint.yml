name: lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # pinned: validated locally against this exact version
          version: v2.13.2

      - name: Job summary
        run: |
          {
            echo "## fsync — lint report"
            echo ""
            echo "golangci-lint **v2.13.2** — ✅ 0 issues"
            echo ""
            echo "Enabled analyses: staticcheck (SA), govet, errcheck, ineffassign, unused."
            echo "SA9003 is deliberately off — empty CAS-failure branches document lock-free invariants (see .golangci.yml)."
          } >> "$GITHUB_STEP_SUMMARY"
